{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Station</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Top Contact Bar */
        .top-bar {
            background-color: #082b55;
            color: white;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
        }

        /* Main Header */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 5%;
            background-color: white;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            width: 75px;
            height: 75px;
            background-color: #e8eef6;
            border: 2px solid #082b55;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .brand h1 {
            color: #082b55;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .brand p {
            color: #555;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
        }

        .search-box input {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px 0 0 5px;
            width: 160px;
        }

        .search-box button {
            background-color: #082b55;
            color: white;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
        }

        /* Navigation Bar */
        nav {
            background-color: #082b55;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 18px 24px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            background-color: #1475cf;
        }

        @media (max-width: 650px) {
            .main-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .brand h1 {
                font-size: 19px;
            }

            .brand p {
                font-size: 12px;
            }

            .search-box input {
                width: 200px;
            }

            nav ul {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Top Contact Bar -->
    <div class="top-bar">
        <span>☎ Emergency: 112</span>
        <span>✉ Kerala Police Station</span>
    </div>

    <!-- Main Header -->
    <header class="main-header">

        <div class="brand">
            <div class="logo">★</div>

            <div>
                <h1>KERALA POLICE STATION</h1>
                <p> SERVICE | SECURITY | JUSTICE </p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search...">
            <button type="button">🔍</button>
        </div>

    </header>

    <!-- Navigation Menu -->
    <nav>
        <ul>
            <li><a href="#{% url 'home' %}" >Home</a></li>
            <li><a href="{% url 'about' %}">About Us</a></li>
            <li><a href="{% url 'service' %}">Services</a></li>
            <li><a href="{% url 'public' %}">Public Services</a></li>
            <li><a href="{% url 'news' %}">News & Updates</a></li>
            <li><a href="{% url 'gallary' %}">Gallery</a></li>
            <li><a href="{% url 'contact' %}">Contact Us</a></li>
            <li><a href="{% url 'complaint' %}">Complaints</a></li>
            <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
        </ul>
    </nav>

</body>
</html>
